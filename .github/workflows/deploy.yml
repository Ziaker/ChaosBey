name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # One-shot maintenance for PR #89 only. It patches the complete existing
  # package-lock in-place, then restores this workflow from main and removes
  # the temporary standalone workflow in the SAME commit. The final branch
  # therefore has no maintenance workflow or widened contents permission.
  sync-camera-release-lock:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 89 && github.head_ref == 'chatgpt/inertial-duel-camera'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/inertial-duel-camera
          fetch-depth: 0

      - name: Patch only the package-lock root version fields
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (lock.name !== 'chaosbey' || !lock.packages || !lock.packages['']) {
            throw new Error('Unexpected package-lock structure; refusing to rewrite it.');
          }
          lock.version = '0.13.0';
          lock.packages[''].version = '0.13.0';
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE
          node -e "const x=require('./package-lock.json'); if(x.version!=='0.13.0'||x.packages[''].version!=='0.13.0') process.exit(1)"

      - name: Restore CI definition, remove temporary workflow, and commit lock sync
        run: |
          git show origin/main:.github/workflows/deploy.yml > .github/workflows/deploy.yml
          git rm -f .github/workflows/one-shot-sync-camera-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/deploy.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'chore(release): sync complete lockfile to v0.13.0'
          git push origin HEAD:chatgpt/inertial-duel-camera

  # Fast gate (~2-3 min): typecheck, the fast suite, the production build.
  # This is the PR/push signal and the only thing deploy waits on — it does
  # NOT include the full Playwright smoke suite, which takes 20-45 minutes
  # serially (single worker — see tests/smoke/playwright.config.ts's own
  # comment) and used to block both the PR check and every Pages deploy on
  # every single push, turning any change, however small, into a ~1 hour
  # round trip. Split out into its own `smoke` job below instead: it still
  # runs on every PR/push (CLAUDE.md section 2's policy), it just no longer
  # gates the fast feedback loop or the deploy.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Full Playwright smoke suite (20-45 min). Runs in parallel with `deploy`,
  # not before it: a regression here is caught and fixed forward, not held
  # as a gate on every iteration. Still required reading after any change
  # that could plausibly affect what it covers (CLAUDE.md section 2).
  smoke:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    # Only Pages deploys are serialized. At workflow level this group put
    # every run (each PR's CI included) in one repo-wide queue: runs waited
    # on each other, and a newly queued run cancelled the one already
    # waiting, so parallel PRs cancelled each other's CI.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
