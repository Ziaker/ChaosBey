name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # GDD 133: Firefox is a supported browser, so the game's own smokes run
  # there too. A separate job so it runs in parallel with the Chromium one
  # instead of after it; the prototype labs stay Chromium-only (see
  # GAME_SMOKE_SPECS in tests/smoke/playwright.config.ts).
  smoke-firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - run: npx playwright install --with-deps firefox
      # Headless Firefox has no GL driver on a display-less, GPU-less runner
      # ("tryNativeGL: Exhausted GL driver options"), so the game can't
      # create its WebGL context. Run it headed on a virtual X display
      # (xvfb, installed by --with-deps) with Mesa's software rasterizer.
      - run: xvfb-run --auto-servernum -- npx playwright test -c tests/smoke/playwright.config.ts --project=firefox --headed
        env:
          CHAOSBEY_PW_INCLUDE_FIREFOX: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, smoke-firefox]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
