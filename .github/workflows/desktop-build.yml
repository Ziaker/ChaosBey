name: Desktop build (Windows + macOS)

# Builds the portable desktop test build (see electron/README.md) on real
# Windows and macOS runners and publishes each as a downloadable artifact —
# the Windows job optionally also as a GitHub Release — so the owner can get
# a build without installing Node, npm, Git, or any dev tooling locally:
# download the artifact zip from this workflow's run page, extract it, open
# ChaosBey.exe (Windows) or ChaosBey.app (macOS, both Intel and Apple
# Silicon builds are produced — see each job's own README.txt for Gatekeeper
# "unsigned app" first-run instructions).
#
# Two triggers, two purposes:
#   - pull_request (scoped to the paths that can affect this packaging):
#     protects any future change to the desktop wrapper by actually building
#     it on a real windows-latest runner before merge. Unlike
#     workflow_dispatch, a pull_request-triggered workflow runs from
#     whatever commit has the file — it does not need to exist on the
#     default branch first, so this validates a PR's own branch pre-merge.
#   - workflow_dispatch: lets the owner get a fresh .exe on demand from the
#     Actions tab ("Run workflow") any time after this file is on `main`.
# Neither runs on every push to every branch — this is a local-testing
# convenience, not the deploy target (that's still deploy.yml → GitHub
# Pages), so it only runs when it can plausibly matter.

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Also publish a GitHub Release with the build attached'
        type: boolean
        default: false
  pull_request:
    branches:
      - main
    paths:
      - 'electron/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (from lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build web (production bundle)
        run: npm run build

      - name: Package Electron (portable Windows folder)
        run: npx electron-builder --win --publish=never

      - name: Validate ChaosBey.exe was actually produced
        shell: pwsh
        run: |
          $exe = "release/win-unpacked/ChaosBey.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "electron-builder did not produce $exe — failing the build."
            exit 1
          }
          Write-Host "Found $exe ($((Get-Item $exe).Length) bytes)"

      - name: Also try a single-file portable .exe (best effort, non-blocking)
        shell: pwsh
        continue-on-error: true
        run: npx electron-builder --win portable --publish=never

      - name: Write build info (commit, version) into the portable folder
        # Runs AFTER the bonus portable-.exe step above, not before: that
        # step's "portable" NSIS target re-extracts a fresh Electron zip and
        # rebuilds release/win-unpacked/ from scratch as a side effect, which
        # used to silently delete this very README.txt when this step ran
        # first (confirmed via job logs: a second "packaging"/"downloaded
        # electron zip extracted successfully"/"signing" sequence for
        # win-unpacked appears mid-run). Writing it last, right before
        # upload, is what actually makes it survive into the artifact.
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}"
          $shortSha = $sha.Substring(0, 8)
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $runNumber = "${{ github.run_number }}"
          $builtAt = Get-Date -AsUTC -Format "yyyy-MM-dd HH:mm:ss 'UTC'"
          @"
          ChaosBey — Windows local test build
          ====================================

          How to run: double-click ChaosBey.exe in this folder. No install,
          no admin rights needed — this whole folder is portable, copy it
          anywhere.

          This build:
            Game version:   $version
            Git commit:     $sha
            Built from run: #$runNumber
            Built at:       $builtAt

          The running game also shows its version and commit in the
          bottom-right corner of every screen (e.g. "v$version . $shortSha"),
          so you can always confirm which build you're playing without
          opening this file.

          Not a Windows-signed executable: on first run, Windows SmartScreen
          may show "Windows protected your PC". Click "More info" then
          "Run anyway" — this is expected for an unsigned local test build,
          not a sign of a problem.

          This is a local-testing convenience only. ChaosBey's real,
          supported target is the web build at
          https://ziaker.github.io/ChaosBey/ — every merge to main deploys
          there automatically.
          "@ | Out-File -FilePath "release/win-unpacked/README.txt" -Encoding utf8

      - name: Upload portable folder as the main artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChaosBey-Windows-Portable
          path: release/win-unpacked/**
          retention-days: 30

      - name: Upload single-file portable .exe, if it was produced
        uses: actions/upload-artifact@v4
        with:
          name: ChaosBey-Portable-exe
          path: release/ChaosBey-Portable.exe
          if-no-files-found: ignore
          retention-days: 30

      - name: Zip the portable folder for the Release (if requested)
        if: ${{ inputs.create_release }}
        shell: pwsh
        run: Compress-Archive -Path release/win-unpacked/* -DestinationPath ChaosBey-Windows-Portable.zip

      - name: Publish GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-build-${{ github.run_number }}
          name: ChaosBey desktop test build ${{ github.run_number }}
          body: |
            Portable Windows test build, built from commit ${{ github.sha }}.
            Download `ChaosBey-Windows-Portable.zip`, extract it anywhere,
            and run `ChaosBey.exe` inside — no installer, no admin rights.
            See `electron/README.md` for details. This is a local-testing
            convenience only; the real deploy target is still GitHub Pages.
          files: |
            ChaosBey-Windows-Portable.zip
            release/ChaosBey-Portable.exe
          prerelease: true

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (from lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build web (production bundle)
        run: npm run build

      - name: Package Electron (unsigned app, x64 + arm64 — package.json's build.mac.identity is null, so no Apple Developer certificate is needed for this local test build)
        run: npx electron-builder --mac --publish=never

      - name: Validate ChaosBey.app was actually produced for both architectures
        run: |
          for dir in release/mac release/mac-arm64; do
            if [ ! -d "$dir/ChaosBey.app" ]; then
              echo "::error::electron-builder did not produce $dir/ChaosBey.app — failing the build."
              exit 1
            fi
            echo "Found $dir/ChaosBey.app"
          done

      - name: Write build info (commit, version) next to each app
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:8}"
          VERSION=$(node -p "require('./package.json').version")
          RUN_NUMBER="${{ github.run_number }}"
          BUILT_AT=$(date -u "+%Y-%m-%d %H:%M:%S UTC")
          for dir in release/mac release/mac-arm64; do
            cat > "$dir/README.txt" <<EOF
          ChaosBey — macOS local test build
          ===================================

          How to run: double-click ChaosBey.app in this folder. No install
          needed — this whole folder is portable, copy it anywhere.

          This build:
            Game version:   $VERSION
            Git commit:     $SHA
            Built from run: #$RUN_NUMBER
            Built at:       $BUILT_AT

          The running game also shows its version and commit in the
          bottom-right corner of every screen (e.g. "v$VERSION . $SHORT_SHA"),
          so you can always confirm which build you're playing without
          opening this file.

          Not a notarized/signed app: on first run, macOS Gatekeeper will
          refuse to open it with "ChaosBey can't be opened because Apple
          cannot check it for malicious software". Right-click (or
          Control-click) ChaosBey.app, choose "Open", then confirm "Open" in
          the dialog — this only needs to be done once, and is expected for
          an unsigned local test build, not a sign of a problem.

          This is a local-testing convenience only. ChaosBey's real,
          supported target is the web build at
          https://ziaker.github.io/ChaosBey/ — every merge to main deploys
          there automatically.
          EOF
          done

      - name: Zip each .app (ditto preserves the bundle's symlinks/permissions and resource forks — a plain directory upload would not)
        run: |
          ditto -c -k --sequesterRsrc --keepParent release/mac/ChaosBey.app release/ChaosBey-macOS-x64.zip
          ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/ChaosBey.app release/ChaosBey-macOS-arm64.zip
          cp release/mac/README.txt release/ChaosBey-macOS-x64-README.txt
          cp release/mac-arm64/README.txt release/ChaosBey-macOS-arm64-README.txt

      - name: Upload macOS x64 (Intel) build
        uses: actions/upload-artifact@v4
        with:
          name: ChaosBey-macOS-x64
          path: |
            release/ChaosBey-macOS-x64.zip
            release/ChaosBey-macOS-x64-README.txt
          retention-days: 30

      - name: Upload macOS arm64 (Apple Silicon) build
        uses: actions/upload-artifact@v4
        with:
          name: ChaosBey-macOS-arm64
          path: |
            release/ChaosBey-macOS-arm64.zip
            release/ChaosBey-macOS-arm64-README.txt
          retention-days: 30
