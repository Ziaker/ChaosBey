name: Sync camera release lock

on:
  push:
    branches:
      - chatgpt/inertial-duel-camera
    paths:
      - .github/workflows/sync-camera-release-lock.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/inertial-duel-camera
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sync root lockfile version to package.json
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          lock.version = pkg.version;
          lock.packages[''].version = pkg.version;
          writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(l.version!==p.version || l.packages[''].version!==p.version) process.exit(1)"
      - name: Commit lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): sync package-lock to 0.13.0"
          git push origin HEAD:chatgpt/inertial-duel-camera
